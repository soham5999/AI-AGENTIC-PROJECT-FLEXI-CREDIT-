                                <div>
                                    <p className="text-slate-400 mb-1">Request Payload Body (JSON):</p>
                                    <pre className="p-3 bg-slate-900 rounded-xl border border-slate-800 text-sky-300">
{JSON.stringify({
  vehicle_age: new Date().getFullYear() - vehicle.year,
  odometer_km: vehicle.mileage,
  days_since_service: vehicle.days_since_service,
  battery_voltage: vehicle.battery_voltage,
  engine_temp: vehicle.engine_temp,
  brake_wear_pct: vehicle.brake_wear_pct,
  tire_pressure_avg: vehicle.tire_pressure_avg,
  oil_life_pct: vehicle.oil_life_pct,
  vehicle_id: vehicle.id
}, null, 2)}
                                    </pre>
                                </div>

                                <div>
                                    <p className="text-slate-400 mb-1">Expected Response Schema (200 OK):</p>
                                    <pre className="p-3 bg-slate-900 rounded-xl border border-slate-800 text-emerald-400">
{JSON.stringify({
  id: "pred-1718000000000",
  timestamp: "2026-03-21 10:30:00",
  probability: 85.0,
  riskLevel: "HIGH",
  maintenanceRequired: "YES",
  affectedAreas: [
    { name: "Brake System", severity: "Critical", detail: "Brake pad wear at 78%" },
    { name: "Engine Lubrication", severity: "Moderate", detail: "Oil life remaining is 22%" }
  ],
  model_version: "RandomForest-v2.4"
}, null, 2)}
                                    </pre>
                                </div>
                            </div>
                        )}

                        {selectedEndpoint === 'agent' && (
                            <div className="space-y-3 font-mono text-xs">
                                <div>
                                    <p className="text-slate-400 mb-1">Request Payload Body (JSON):</p>
                                    <pre className="p-3 bg-slate-900 rounded-xl border border-slate-800 text-sky-300">
{JSON.stringify({
  query: "Perform complete maintenance diagnostic for my vehicle and give action items.",
  vehicle_id: vehicle.id
}, null, 2)}
                                    </pre>
                                </div>
                                <div>
                                    <p className="text-slate-400 mb-1">Agent Response Schema (200 OK):</p>
                                    <pre className="p-3 bg-slate-900 rounded-xl border border-slate-800 text-emerald-400">
{JSON.stringify({
  healthScore: 15,
  riskLevel: "HIGH",
  probability: 85.0,
  reasoningText: "The AI Agent determined a HIGH risk of vehicle component failure...",
  recommendations: [
    { action: "Replace front and rear brake pads", priority: "Urgent", timeframe: "Within 3 days" }
  ],
  agentMode: "Groq AI Agent / Demo Rule-Based Fallback",
  toolsCalled: ["get_vehicle_information", "predict_vehicle_maintenance", "analyze_vehicle_health", "get_maintenance_history", "save_prediction"]
}, null, 2)}
                                    </pre>
                                </div>
                            </div>
                        )}

                        {selectedEndpoint === 'vehicles' && (
                            <div className="space-y-3 font-mono text-xs">
                                <div>
                                    <p className="text-slate-400 mb-1">HTTP Method & Path:</p>
                                    <p className="p-2 bg-slate-900 rounded-lg text-emerald-400">GET /api/vehicles</p>
                                </div>
                                <div>
                                    <p className="text-slate-400 mb-1">Response Schema (Array of Vehicle records):</p>
                                    <pre className="p-3 bg-slate-900 rounded-xl border border-slate-800 text-emerald-400">
{JSON.stringify([{
  id: "v-camry-01",
  make: "Toyota",
  model: "Camry Hybrid (Demo Fleet Vehicle)",
  year: 2021,
  mileage: 62450,
  battery_voltage: 11.9,
  brake_wear_pct: 78.0,
  oil_life_pct: 22.0
}], null, 2)}
                                    </pre>
                                </div>
                            </div>
                        )}

                        {selectedEndpoint === 'metrics' && (
                            <div className="space-y-3 font-mono text-xs">
                                <div>
                                    <p className="text-slate-400 mb-1">HTTP Method & Path:</p>
                                    <p className="p-2 bg-slate-900 rounded-lg text-emerald-400">GET /api/model/performance</p>
                                </div>
                                <div>
                                    <p className="text-slate-400 mb-1">Response Schema (Scikit-Learn Evaluation Metrics):</p>
                                    <pre className="p-3 bg-slate-900 rounded-xl border border-slate-800 text-emerald-400">
{JSON.stringify({
  accuracy: 90.8,
  precision: 87.2,
  recall: 89.1,
  f1Score: 88.2,
  confusionMatrix: { truePositives: 49, falsePositives: 7, trueNegatives: 60, falseNegatives: 6 },
  sampleSize: 600,
  modelType: "Random Forest Classifier (Scikit-Learn)"
}, null, 2)}
                                    </pre>
                                </div>
                            </div>
                        )}

                        <div className="pt-3 border-t border-slate-800 flex justify-between items-center">
                            <a
                                href="http://127.0.0.1:8000/docs"
                                target="_blank"
                                rel="noreferrer"
                                className="text-xs text-sky-400 hover:text-sky-300 flex items-center gap-1 font-mono"
                            >
                                <i data-lucide="external-link" className="w-3.5 h-3.5"></i>
                                Open Full Swagger UI (/docs)
                            </a>
                            <button onClick={onClose} className="px-4 py-2 bg-slate-900 text-slate-300 text-xs rounded-lg hover:bg-slate-800">Close Inspector</button>
                        </div>
                    </div>
                </div>
            );
        }

        // Render Application
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
